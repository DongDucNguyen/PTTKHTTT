{% macro csrf() %}<input type="hidden" name="_csrf" value="{{ csrf_token() }}">{% endmacro %}

{% macro product_grid(styles) %}
  <div class="grid">
    {% for s in styles %}
      <a class="product" href="{{ url_for('shop.style_detail', style_id=s.id) }}">
        <div class="thumb">
          {% if s.cover %}<img src="/{{ s.cover }}" alt="{{ s.name }}" loading="lazy">{% else %}<span class="none">(chưa có ảnh)</span>{% endif %}
        </div>
        <div class="info">
          <div class="name">{{ s.name }}</div>
          <div class="muted small">{{ s.brand or '' }}</div>
          <div class="price">từ {{ s.min_price|money }}</div>
        </div>
      </a>
    {% endfor %}
  </div>
{% endmacro %}

{% macro status(value) %}<span class="status {{ value.value if value else '' }}">{{ value|label }}</span>{% endmacro %}
